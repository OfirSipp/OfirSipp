<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="268" viewBox="0 0 1200 268" role="img" aria-label="Timeline: Israeli Air Force navigation and GNSS specialist 2022-2025; Gate Technologies hardware development since April 2026; practical electronics engineering diploma 2022 summa cum laude; B.Sc. Electrical Engineering at HIT, expected 2028">
  <defs>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="ongoing" gradientUnits="userSpaceOnUse" x1="821.15" y1="0" x2="1180" y2="0">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.16"/>
      <stop offset="0.55" stop-color="#2dd4bf" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ongoingStroke" gradientUnits="userSpaceOnUse" x1="821.15" y1="0" x2="1180" y2="0">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="1"/>
      <stop offset="0.6" stop-color="#2dd4bf" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="studying" gradientUnits="userSpaceOnUse" x1="828.46" y1="0" x2="910.08" y2="0">
      <stop offset="0" stop-color="#f0b429" stop-opacity="0"/>
      <stop offset="1" stop-color="#f0b429" stop-opacity="0.14"/>
    </linearGradient>
    <linearGradient id="studyingStroke" gradientUnits="userSpaceOnUse" x1="828.46" y1="0" x2="910.08" y2="0">
      <stop offset="0" stop-color="#f0b429" stop-opacity="0"/>
      <stop offset="1" stop-color="#f0b429" stop-opacity="1"/>
    </linearGradient>
    <clipPath id="past"><rect x="0" y="0" width="900.08" height="268"/></clipPath>
    <clipPath id="future"><rect x="900.08" y="0" width="299.92" height="268"/></clipPath>
    <clipPath id="frame"><rect width="1200" height="268" rx="12"/></clipPath>
    <clipPath id="reveal">
      <rect x="0" y="0" width="200" height="268">
        <animate attributeName="width" values="200;1200" dur="2.4s" begin="0.2s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
      </rect>
    </clipPath>
  </defs>

  <rect x="0.5" y="0.5" width="1199" height="267" rx="12" fill="#0d1117" stroke="#30363d"/>

  <rect x="64" y="30" width="3" height="20" fill="#2dd4bf"/>
  <text x="78" y="47" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" fill="#e6edf3"><tspan font-weight="600">Career</tspan><tspan fill="#8b949e">, as a timing diagram</tspan></text>

  <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#6e7681">
    <text x="64" y="116">role</text>
    <text x="64" y="186">edu</text>
  </g>

  <g stroke="#21262d" stroke-dasharray="2 5"><line x1="200" y1="70" x2="200" y2="230"/><line x1="346.15" y1="70" x2="346.15" y2="230"/><line x1="492.31" y1="70" x2="492.31" y2="230"/><line x1="638.46" y1="70" x2="638.46" y2="230"/><line x1="784.62" y1="70" x2="784.62" y2="230"/><line x1="930.77" y1="70" x2="930.77" y2="230"/><line x1="1076.92" y1="70" x2="1076.92" y2="230"/></g>

  <g clip-path="url(#reveal)">
    <!-- idle lines (high-Z between segments) -->
    <g stroke="#30363d" stroke-width="1.5" fill="none">
      <path d="M200 112H261.38M778.77 112H821.15"/>
      <path d="M200 182H828.46"/>
    </g>

    <!-- role -->
    <path d="M261.38 112L269.38 88H770.77L778.77 112L770.77 136H269.38Z" fill="#2dd4bf" fill-opacity="0.10" stroke="#2dd4bf" stroke-opacity="0.75" stroke-width="1.4"/>
    <path d="M821.15 112L829.15 88H1182L1190 112L1182 136H829.15Z" fill="url(#ongoing)" stroke="url(#ongoingStroke)" stroke-width="1.4" clip-path="url(#past)"/>
    <path d="M821.15 112L829.15 88H1182L1190 112L1182 136H829.15Z" fill="url(#ongoing)" stroke="url(#ongoingStroke)" stroke-width="1.4" stroke-dasharray="5 5" clip-path="url(#future)"/>
    <text x="279.38" y="109" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#e6edf3">Israeli Air Force <tspan font-weight="400" fill="#8b949e">· Navigation &amp; GNSS Specialist</tspan></text>
    <text x="279.38" y="127" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.5" fill="#6e7681">FPGA development · VHDL / Python test automation</text>
    <text x="837.15" y="109" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#e6edf3">Gate Technologies</text>
    <text x="837.15" y="127" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.5" fill="#6e7681">HW dev · validation · failure analysis</text>

    <!-- edu -->
    <path d="M255.54 173L264.54 182L255.54 191L246.54 182Z" fill="#f0b429"/>
    <text x="275.54" y="179" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#e6edf3">Practical Electronics Eng. <tspan font-weight="400" fill="#8b949e">· summa cum laude</tspan></text>
    <text x="275.54" y="197" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.5" fill="#6e7681">Amal B College · 2022 · embedded systems &amp; FPGA</text>
    <path d="M828.46 182L836.46 162H1112.77L1120.77 182L1112.77 202H836.46Z" fill="url(#studying)" stroke="url(#studyingStroke)" stroke-width="1.4" clip-path="url(#past)"/>
    <path d="M828.46 182L836.46 162H1112.77L1120.77 182L1112.77 202H836.46Z" fill="#f0b429" fill-opacity="0.14" stroke="#f0b429" stroke-width="1.4" stroke-dasharray="5 5" clip-path="url(#future)"/>
    <text x="914.08" y="179" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#e6edf3">B.Sc. EE <tspan font-weight="400" fill="#8b949e">· HIT</tspan></text>
    <text x="914.08" y="197" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.5" fill="#6e7681">expected 2028</text>
  </g>

  <!-- axis -->
  <line x1="200" y1="230" x2="1150" y2="230" stroke="#30363d"/>
  <g stroke="#30363d" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" fill="#6e7681" text-anchor="middle"><line x1="200" y1="230" x2="200" y2="236"/><text x="200" y="252" stroke="none">2022</text><line x1="346.15" y1="230" x2="346.15" y2="236"/><text x="346.15" y="252" stroke="none">2023</text><line x1="492.31" y1="230" x2="492.31" y2="236"/><text x="492.31" y="252" stroke="none">2024</text><line x1="638.46" y1="230" x2="638.46" y2="236"/><text x="638.46" y="252" stroke="none">2025</text><line x1="784.62" y1="230" x2="784.62" y2="236"/><text x="784.62" y="252" stroke="none">2026</text><line x1="930.77" y1="230" x2="930.77" y2="236"/><text x="930.77" y="252" stroke="none">2027</text><line x1="1076.92" y1="230" x2="1076.92" y2="236"/><text x="1076.92" y="252" stroke="none">2028</text></g>

  <!-- now -->
  <line x1="900.08" y1="74" x2="900.08" y2="230" stroke="#f0b429" stroke-opacity="0.75" stroke-dasharray="3 3"/>
  <text x="900.08" y="66" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" fill="#f0b429" text-anchor="middle" letter-spacing="1">NOW</text>
  <circle cx="900.08" cy="230" r="4" fill="#f0b429"/>
  <circle cx="900.08" cy="230" r="4" fill="none" stroke="#f0b429">
    <animate attributeName="r" values="4;14" dur="2.2s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.8;0" dur="2.2s" repeatCount="indefinite"/>
  </circle>

  <!-- sampling sweep -->
  <g clip-path="url(#frame)">
    <rect x="200" y="70" width="2" height="160" fill="#2dd4bf" opacity="0" filter="url(#glow)">
      <animate attributeName="x" values="200;900.08;900.08" keyTimes="0;0.55;1" dur="7s" begin="2.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.7;0.7;0;0" keyTimes="0;0.05;0.5;0.56;1" dur="7s" begin="2.8s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
